<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fice AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f8;
  color: #111827;
}

header {
  height: 64px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  padding: 0 20px;
}

.logo {
  width: 40px;
  height: 40px;
  background: #111827;
  color: white;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 22px;
  margin-right: 10px;
}

.name {
  font-size: 23px;
  font-weight: bold;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin-top: 18vh;
}

.welcome h1 {
  font-size: 38px;
  margin-bottom: 10px;
}

.welcome p {
  color: #6b7280;
  font-size: 17px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 35px;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 18px;
  cursor: pointer;
}

.card:hover {
  border-color: #9ca3af;
}

.card b {
  display: block;
  margin-bottom: 6px;
}

.card span {
  color: #6b7280;
  font-size: 14px;
}

#chat {
  padding-bottom: 120px;
}

.message {
  padding: 15px 17px;
  margin: 16px 0;
  border-radius: 17px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #111827;
  color: white;
  margin-left: 15%;
}

.ai {
  background: white;
  border: 1px solid #e5e7eb;
  margin-right: 15%;
}

form {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px, calc(100% - 30px));
  display: flex;
  gap: 8px;
  padding: 8px;
  background: white;
  border: 1px solid #d1d5db;
  border-radius: 20px;
  box-shadow: 0 8px 30px #0002;
}

input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 12px;
}

button {
  border: none;
  background: #111827;
  color: white;
  border-radius: 13px;
  padding: 0 17px;
  font-size: 18px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .welcome h1 {
    font-size: 29px;
  }

  .cards {
    grid-template-columns: 1fr;
  }

  .user {
    margin-left: 5%;
  }

  .ai {
    margin-right: 5%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">F</div>
  <div class="name">Fice</div>
</header>

<main>

<div class="welcome" id="welcome">
  <h1>What can I help you with?</h1>
  <p>Your AI assistant.</p>

  <div class="cards">

    <div class="card" onclick="ask('Explain something to me')">
      💡
      <b>Explain something</b>
      <span>Get a simple explanation.</span>
    </div>

    <div class="card" onclick="ask('Help me create an idea')">
      ✨
      <b>Create an idea</b>
      <span>Turn your thoughts into ideas.</span>
    </div>

    <div class="card" onclick="ask('Write something for me')">
      ✍️
      <b>Write for me</b>
      <span>Create text with Fice.</span>
    </div>

    <div class="card" onclick="ask('What can you do?')">
      🤖
      <b>Ask Fice</b>
      <span>See what your AI can do.</span>
    </div>

  </div>
</div>

<div id="chat"></div>

</main>

<form id="form">

  <input
    id="input"
    placeholder="Message Fice..."
    autocomplete="off"
  >

  <button type="submit">➤</button>

</form>

<script>

const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function ask(text) {

  input.value = text;

  form.requestSubmit();

}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  welcome.style.display = "none";

  addMessage(text, "user");

  input.value = "";

  const thinking = addMessage("Thinking...", "ai");

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    if (data.reply) {

      thinking.textContent = data.reply;

    } else {

      thinking.textContent =
        "Fice couldn't generate a response.";

    }

  } catch (error) {

    thinking.textContent =
      "Fice couldn't connect to the AI.";

  }

});

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return message;

}

</script>

</body>
</html>
